<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CEPTRI</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--primary-color);
        }
        .login-card {
            background: white; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h2 { margin-bottom: 8px; color: var(--text-primary); }
        .login-card p { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 25px; }
        .login-card .form-group { text-align: left; margin-bottom: 18px; }
        .login-card .btn-primary { width: 100%; justify-content: center; padding: 12px; margin-top: 10px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="font-size: 2.5rem; color: var(--secondary-color); margin-bottom: 10px;">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>CEPTRI</h2>
        <p>Ingresa tus credenciales para acceder</p>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" required placeholder="admin@ceptri.edu.mx">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>
    </div>

</body>
</html>
